# flow_policy 训练配置（键名参照 patch_policy/configs/train_libero_goal_diffusion.yaml，扁平化）
# 用法：accelerate launch --mixed_precision=bf16 flow_policy/train.py --config flow_policy/configs/train.yaml

# 指向你处理数据时放在数据路径下的 meta.json（见 README「meta.json 格式」）
# 服务器：train 服务器 /data/data/lerobot_v30_ee_6d/meta.json（已过滤到单任务 episodes 800-899）
metas_path: /data/data/lerobot_v30_ee_6d/meta.json

seed: 42
num_actions: 30          # flow 目标 chunk 步数（query_duration=1.0s → 步长 ~0.033s；handler 网格与录制帧率解耦）
# 24GB 卡实测上限：batch 256 峰值 21.7GB（90%）。precompute 模式下 batch 即有效 batch
batch_size: 256
num_workers: 8
image_aug: false         # precompute 模式固定编码，无逐帧增强，此开关无意义，置 false 明确
use_frame_weight: false  # 使用 data/*.parquet 的 frame_weight 列做逐帧重采样（v3.0 专属）
gradient_accumulation_steps: 1   # batch 256 已够大，无需累积；有效 batch = batch_size

# 预计算 embedding（precompute.py 输出目录）：true 则从 npy 索引，不走视频解码/DINOv2
# false 则 on-the-fly 视频解码（保底）。注意：precompute 无 per-epoch 增强（每帧固定编码）
# precompute 产物与训练 ckpt 都放服务器 /cloud/cloud-ssd1/goai_800/
precomputed_embeddings: true
precomputed_dir: /cloud/cloud-ssd1/goai_800/data_precompute

# 帧数已核实（parquet length 求和 / 视频解码 / precompute 三路一致）：100 eps = 26,550 帧
# 5000 步 × 256 / 26550 = 48.2 epochs（用户确认）
iters: 5000
warmup_steps: 400        # ~8% iters
max_grad_norm: 1.0
log_interval: 20
save_interval: 1000      # 每 ~9.6 epochs 存一个 ckpt（共 5 个）

save_path: /cloud/cloud-ssd1/goai_800/checkpoints

optim:
  lr: 0.0001          # 写小数形式：yaml 6.x 把 `1e-4`（无小数点）解析成 str
  weight_decay: 0.0
  betas: [0.9, 0.95]

model:
  dim_action: 20
  dim_propio: 20
  cond_dim: 384          # DINOv2 vits14 patch token 维度
  n_patches: 256         # 每视图 patch 数（224x224, patch_size 14 -> 16x16）
  views: 3               # cam_high + 左/右 wrist
  num_actions: 30
  n_obs_steps: 1         # 观测窗口帧数；>1 时 obs_cond 按窗口序平铺 [T_obs*V*P, E]（块因果 mask 对应）
  n_layer: 12
  n_head: 12
  n_embd: 768
  p_drop_emb: 0.0
  p_drop_attn: 0.1
